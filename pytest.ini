[pytest]
# Pytest configuration for Finance Genie

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    api: Tests requiring API keys
    db: Tests requiring database

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Timeout for tests (seconds)
timeout = 300
